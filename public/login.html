<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#E2DFEB">
  <meta name="description" content="Sign in — Handshake.sh">
  <title>Sign in — Handshake.sh</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700;800&family=JetBrains+Mono:wght@700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="network.css">
</head>
<body class="login-page">
  <div class="hardware-bg-pattern" aria-hidden="true"></div>

  <main class="login-shell chassis-card">
    <div class="chassis-header">
      <div class="hazard-stripe" aria-hidden="true"></div>
      <div class="login-brand" aria-label="Handshake.sh">
        <span class="brand-bracket">[</span>
        <span class="brand-title">HANDSHAKE<span class="brand-dot">.SH</span></span>
        <span class="brand-bracket">]</span>
      </div>
    </div>

    <header class="login-header">
      <div class="divider-title">
        <span class="divider-line"></span>
        <h1 class="login-title" id="accessTitle">ACCESS PORTAL</h1>
        <span class="divider-line"></span>
      </div>
      <p class="login-subtitle">TECHFEST 2026</p>
    </header>

    <form id="loginForm" class="login-form" novalidate aria-labelledby="accessTitle">
      <div class="login-field">
        <label for="username">USERNAME</label>
        <div class="crt-input-wrap">
          <input id="username" class="input crt-input" name="username" type="text" autocomplete="username" required>
        </div>
      </div>

      <div class="login-field">
        <label for="password">PASSWORD</label>
        <div class="password-wrap crt-input-wrap">
          <input id="password" class="input crt-input" name="password" type="password" autocomplete="current-password" required>
          <button id="togglePw" class="password-toggle" type="button" aria-label="Show password"><span id="eyeIcon" aria-hidden="true">Show</span></button>
        </div>
      </div>

      <div class="login-error" id="errorMessage" role="alert" aria-live="polite"></div>

      <div class="login-submit">
        <button class="btn btn-beveled btn-block" id="continueBtn" type="submit">
          <span class="spinner" aria-hidden="true"></span>
          <span class="btn-label">SIGN IN</span>
        </button>
      </div>
    </form>
  </main>
  <script src="login.js"></script>
</body>
</html>
