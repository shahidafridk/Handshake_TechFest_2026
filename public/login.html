<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sign In — Handshake.sh</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Ccircle cx='5' cy='11' r='3.4' fill='%23111827'/%3E%3Cline x1='8.6' y1='11' x2='13.4' y2='11' stroke='%23D8DEE4' stroke-width='1.6'/%3E%3Ccircle cx='17' cy='11' r='3.4' fill='%232F8F6B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:var(--tf-canvas);
    --surface:var(--tf-surface-raised);
    --card:var(--tf-surface);
    --text:var(--tf-ink);
    --text-dim:var(--tf-ink-muted);
    --placeholder:var(--tf-ink-faint);
    --border:var(--tf-line);
    --accent:var(--tf-signal);
    --warning:var(--tf-caution);
    --button:var(--tf-ink);
    --success:var(--tf-verified);

    --ease-spring: cubic-bezier(.22,1,.36,1);
    --ease-out: cubic-bezier(.16,1,.3,1);
  }

  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }

  ::selection{ background:var(--accent); color:#FFFFFF; }

  .network-bg{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    width:100%;
    height:100%;
    background:var(--bg);
  }
  .network-bg .n-line{
    fill:none;
    stroke:rgba(17,24,39,0.028);
    stroke-width:0.4;
    stroke-linecap:round;
  }
  .network-bg .n-line-bridge{
    fill:none;
    stroke:rgba(17,24,39,0.02);
    stroke-width:0.35;
    stroke-linecap:round;
  }
  .network-bg .n-hub,
  .network-bg .n-spoke{
    fill:#111827;
    fill-opacity:var(--op, 0.04);
  }

  .network-fade{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:linear-gradient(to right,
      transparent 0%,
      var(--bg) 18%,
      rgba(243,245,247,0.35) 50%,
      var(--bg) 82%,
      transparent 100%);
    opacity:0.55;
  }

  .network-bg .n-pulse{
    animation:packetFlash 10s ease-out infinite;
    will-change:transform;
  }
  .network-bg .n-react{
    animation:reactFlash 10s ease-out infinite;
    will-change:opacity;
  }

  .network-bg .pulse-a-0{ animation-delay:0s; }
  .network-bg .pulse-a-1{ animation-delay:.13s; }
  .network-bg .pulse-a-2{ animation-delay:.26s; }
  .network-bg .pulse-a-3{ animation-delay:.39s; }
  .network-bg .pulse-a-4{ animation-delay:.52s; }
  .network-bg .react-a{ animation-delay:.05s; }

  .network-bg .pulse-b-0{ animation-delay:3.3s; }
  .network-bg .pulse-b-1{ animation-delay:3.43s; }
  .network-bg .pulse-b-2{ animation-delay:3.56s; }
  .network-bg .pulse-b-3{ animation-delay:3.69s; }
  .network-bg .pulse-b-4{ animation-delay:3.82s; }
  .network-bg .react-b{ animation-delay:3.35s; }

  .network-bg .pulse-c-0{ animation-delay:6.6s; }
  .network-bg .pulse-c-1{ animation-delay:6.73s; }
  .network-bg .pulse-c-2{ animation-delay:6.86s; }
  .network-bg .pulse-c-3{ animation-delay:6.99s; }
  .network-bg .react-c{ animation-delay:6.65s; }

  @keyframes packetFlash{
    0%, 7%, 100%{ fill-opacity:var(--op); transform:scale(1); }
    2%{ fill-opacity:0.55; fill:#2F8F6B; transform:scale(2.6); }
  }
  @keyframes reactFlash{
    0%, 10%, 100%{ fill-opacity:var(--op); transform:scale(1); }
    4%{ fill-opacity:0.2; transform:scale(1.5); }
  }

  @media (prefers-reduced-motion: reduce){
    .network-bg .n-pulse, .network-bg .n-react{ animation:none; }
  }

  .top-shade{
    position:fixed;
    top:0; left:0; right:0;
    height:160px;
    background:linear-gradient(to bottom, rgba(17,24,39,0.045), transparent);
    pointer-events:none;
    z-index:0;
  }

  .page{
    position:relative;
    z-index:1;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:48px 24px;
  }

  .frame{
    width:100%;
    max-width:390px;
    opacity:0;
    transform:translateY(10px);
    animation:riseIn .8s var(--ease-out) forwards;
  }

  @keyframes riseIn{
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- BRAND ---------- */

  .brand{
    text-align:center;
    margin-bottom:40px;
  }

  .brand-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin-bottom:9px;
  }

  .brand-glyph{ width:20px; height:20px; flex-shrink:0; overflow:visible; }
  .brand-glyph .mg-node{ transition:fill .3s var(--ease-out); }
  .brand-glyph .mg-a{ fill:var(--text); }
  .brand-glyph .mg-spoke{ fill:var(--border); }
  .brand-glyph .mg-spoke.mg-b{
    fill:var(--accent);
    animation:markPulse 5s ease-in-out infinite;
    transform-origin:17px 14.5px;
  }
  .brand-glyph .mg-line{ stroke:var(--border); stroke-width:1; }

  @keyframes markPulse{
    0%,100%{ opacity:0.85; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.12); }
  }

  .brand-mark{
    position:relative;
    display:inline-block;
    font-size:19px;
    font-weight:700;
    letter-spacing:-0.01em;
    margin-bottom:0;
  }

  .brand-mark span{ color:var(--accent); }

  .brand-mark::before,
  .brand-mark::after{
    content: attr(data-text);
    position:absolute;
    inset:0;
    background:var(--bg);
    opacity:0;
    pointer-events:none;
    white-space:nowrap;
  }

  .brand-mark::before{ color:var(--accent); }
  .brand-mark::after{ color:#374151; }

  .brand-mark.glitching::before{
    opacity:0.9;
    animation:glitchSliceA 420ms steps(2,end);
  }
  .brand-mark.glitching::after{
    opacity:0.9;
    animation:glitchSliceB 420ms steps(2,end);
  }

  @keyframes glitchSliceA{
    0%{ clip-path:inset(0 0 72% 0); transform:translate(-3px,0); }
    20%{ clip-path:inset(24% 0 40% 0); transform:translate(2px,0); }
    40%{ clip-path:inset(58% 0 8% 0); transform:translate(-2px,0); }
    60%{ clip-path:inset(6% 0 66% 0); transform:translate(3px,0); }
    80%{ clip-path:inset(40% 0 30% 0); transform:translate(-1px,0); }
    100%{ opacity:0; transform:translate(0,0); }
  }

  @keyframes glitchSliceB{
    0%{ clip-path:inset(66% 0 6% 0); transform:translate(3px,0); }
    20%{ clip-path:inset(10% 0 60% 0); transform:translate(-2px,0); }
    40%{ clip-path:inset(44% 0 26% 0); transform:translate(2px,0); }
    60%{ clip-path:inset(70% 0 4% 0); transform:translate(-3px,0); }
    80%{ clip-path:inset(20% 0 50% 0); transform:translate(1px,0); }
    100%{ opacity:0; transform:translate(0,0); }
  }

  @media (prefers-reduced-motion: reduce){
    .brand-mark.glitching::before,
    .brand-mark.glitching::after{ animation:none; opacity:0; }
  }

  .brand-caption{
    font-family:'Space Mono', monospace;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--text-dim);
  }

  /* ---------- WELCOME ---------- */

  .welcome{
    margin-bottom:32px;
    text-align:center;
  }

  .beacon-wrap{
    width:76px;
    height:76px;
    margin:0 auto 28px;
    position:relative;
    transition:transform .5s var(--ease-out);
  }

  .beacon-wrap::before{
    content:'';
    position:absolute;
    left:50%;
    top:50%;
    width:118px;
    height:118px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    pointer-events:none;
    z-index:0;
    background:radial-gradient(circle, rgba(47,143,107,0.09) 0%, rgba(47,143,107,0.03) 42%, transparent 70%);
    transition:opacity .5s var(--ease-out), background .5s var(--ease-out);
  }

  .beacon-wrap.active::before{
    background:radial-gradient(circle, rgba(47,143,107,0.15) 0%, rgba(47,143,107,0.06) 42%, transparent 70%);
  }

  .beacon-wrap.connecting::before{
    background:radial-gradient(circle, rgba(47,143,107,0.2) 0%, rgba(47,143,107,0.08) 42%, transparent 70%);
  }

  .beacon-wrap svg{ position:relative; z-index:1; width:100%; height:100%; overflow:visible; }

  .beacon-wrap.active{ transform:scale(1.04); }
  .beacon-wrap.connecting{ transform:scale(1.06); }

  .beacon .ring-track{
    fill:none;
    stroke:var(--border);
    stroke-width:1.2;
    transition:stroke .5s var(--ease-out);
    transform-origin:32px 32px;
    animation:ringBreathe 6s ease-in-out infinite;
    will-change:transform, opacity;
  }

  @keyframes ringBreathe{
    0%,100%{ transform:scale(1); opacity:0.85; }
    50%{ transform:scale(1.035); opacity:1; }
  }

  .beacon-wrap.connecting .ring-track{
    stroke:rgba(47,143,107,0.4);
  }

  .beacon .pulse-ring{
    fill:none;
    stroke:var(--accent);
    stroke-width:1;
    opacity:0;
    transform-origin:32px 32px;
    animation:pulseExpand 5s var(--ease-out) infinite;
  }

  .beacon-wrap.connecting .pulse-ring{
    animation:successPulse 0.9s var(--ease-out) 1;
  }

  @keyframes successPulse{
    0%{ transform:scale(0.65); opacity:0.5; }
    100%{ transform:scale(1.7); opacity:0; }
  }

  @keyframes pulseExpand{
    0%{ transform:scale(0.72); opacity:0.3; }
    70%{ opacity:0; }
    100%{ transform:scale(1.4); opacity:0; }
  }

  .beacon .orbit-group{
    transform-origin:32px 32px;
    animation:orbitSpin 9s linear infinite;
    will-change:transform;
  }

  .beacon-wrap.connecting .orbit-group{
    animation-duration:2.6s;
  }

  @keyframes orbitSpin{ to{ transform:rotate(360deg); -webkit-transform:rotate(360deg); } }

  .beacon .satellite{ fill:var(--accent); }

  .beacon .satellite-halo{
    fill:var(--accent);
    opacity:0.35;
    filter:blur(2.5px);
    will-change:opacity;
    transition:opacity .4s var(--ease-out);
  }

  .beacon-wrap.connecting .satellite-halo{ opacity:0.75; }

  .beacon .node{
    fill:var(--accent);
    animation:nodeBreathe 5s ease-in-out infinite;
    transform-origin:32px 32px;
  }

  .beacon .node-halo{
    fill:var(--accent);
    opacity:0.28;
    filter:blur(3.5px);
    will-change:opacity;
    transition:opacity .4s var(--ease-out);
    transform-origin:32px 32px;
  }

  .beacon-wrap.active .node-halo{ opacity:0.4; }
  .beacon-wrap.connecting .node-halo{ opacity:0.6; }

  .beacon-wrap.connecting .node{ animation:nodePulseFast 0.85s ease-in-out infinite; }

  @keyframes nodeBreathe{
    0%,100%{ opacity:0.85; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.12); }
  }
  @keyframes nodePulseFast{
    0%,100%{ opacity:0.9; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.3); }
  }

  @media (prefers-reduced-motion: reduce){
    .beacon .orbit-group, .beacon .node, .beacon .pulse-ring, .beacon .ring-track{ animation:none; }
  }

  .welcome p{ margin-left:auto; margin-right:auto; }

  .welcome h1{
    font-size:41px;
    font-weight:700;
    letter-spacing:-0.032em;
    line-height:1.08;
    margin-bottom:10px;
    color:var(--text);
  }

  .welcome p{
    font-size:15px;
    font-weight:400;
    color:var(--text-dim);
    line-height:1.6;
    max-width:290px;
  }

  /* ---------- FORM ---------- */

  form{ display:flex; flex-direction:column; gap:20px; }

  .field{
    display:flex;
    flex-direction:column;
    gap:9px;
  }

  .field label{
    font-size:12.5px;
    font-weight:600;
    color:#4B5563;
    letter-spacing:0.02em;
  }

  .input-wrap{ position:relative; }

  .input-wrap input{
    width:100%;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:17px;
    padding:16px 18px;
    font-family:inherit;
    font-size:15px;
    color:var(--text);
    outline:none;
    box-shadow:inset 0 1px 2px rgba(17,24,39,0.035), 0 1px 2px rgba(17,24,39,0.03);
    transition:border-color .35s var(--ease-out), background .35s var(--ease-out), box-shadow .35s var(--ease-out), transform .2s var(--ease-spring);
  }

  .input-wrap input::placeholder{
    color:var(--placeholder);
    transition:color .3s var(--ease-out);
  }

  .input-wrap input:hover{ background:var(--surface); }

  .input-wrap input:focus{
    border-color:var(--accent);
    background:var(--surface);
    box-shadow:inset 0 1px 2px rgba(17,24,39,0.03), 0 0 0 3px rgba(47,143,107,0.14), 0 8px 18px -14px rgba(17,24,39,0.16);
  }

  .input-wrap input:active{ transform:scale(0.995); }

  .input-wrap .toggle-pw{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    background:none;
    border:none;
    color:var(--text-dim);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px;
    transition:color .25s var(--ease-out);
  }
  .input-wrap .toggle-pw:hover{ color:var(--text); }
  .input-wrap .toggle-pw:active{ transform:translateY(-50%) scale(0.88); }
  .input-wrap .toggle-pw svg{ width:17px; height:17px; }

  .input-wrap.has-toggle input{ padding-right:46px; }

  /* row: remember + forgot */

  .form-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:2px;
  }

  .remember{
    display:flex;
    align-items:center;
    gap:9px;
    cursor:pointer;
    user-select:none;
  }

  .checkbox{
    width:18px;
    height:18px;
    border-radius:6px;
    border:1px solid var(--border);
    background:var(--card);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    transition:all .25s var(--ease-out);
  }

  .checkbox svg{
    width:11px;
    height:11px;
    opacity:0;
    transform:scale(0.5);
    transition:all .25s var(--ease-spring);
    stroke:#FFFFFF;
  }

  .remember input{ display:none; }

  .remember input:checked + .checkbox{
    background:var(--accent);
    border-color:var(--accent);
  }

  .remember input:checked + .checkbox svg{
    opacity:1;
    transform:scale(1);
  }

  .remember span{
    font-size:13.5px;
    color:var(--text-dim);
    transition:color .25s var(--ease-out);
  }

  .remember:hover span{ color:var(--text); }
  .remember:active .checkbox{ transform:scale(0.9); }

  .forgot{
    font-size:13.5px;
    color:var(--text-dim);
    font-weight:500;
    background:none;
    border:none;
    font-family:inherit;
    cursor:pointer;
    padding:0;
    transition:color .25s var(--ease-out);
  }
  .forgot:hover{ color:var(--accent); }
  .forgot:active{ color:var(--accent); opacity:0.7; }

  /* error banner */
  .error-banner {
    display: none;
    background: rgba(239, 68, 68, 0.08);
    border: 1px solid rgba(239, 68, 68, 0.28);
    color: #dc2626;
    font-size: 13.5px;
    font-weight: 500;
    padding: 12px 16px;
    border-radius: 14px;
    text-align: center;
    line-height: 1.4;
    animation: shakeErr 0.35s var(--ease-spring);
  }

  @keyframes shakeErr {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-4px); }
    40%, 80% { transform: translateX(4px); }
  }

  /* continue button */

  .btn-continue{
    position:relative;
    overflow:hidden;
    appearance:none;
    border:none;
    background:var(--button);
    color:#FFFFFF;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    letter-spacing:-0.01em;
    padding:17px;
    border-radius:18px;
    cursor:pointer;
    margin-top:14px;
    transition:transform .3s var(--ease-spring), box-shadow .3s var(--ease-out);
    box-shadow:0 1px 0 rgba(255,255,255,0.08) inset, 0 10px 22px -14px rgba(17,24,39,0.22);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }

  .btn-continue:hover{
    transform:translateY(-2px);
    box-shadow:0 1px 0 rgba(255,255,255,0.08) inset, 0 14px 28px -14px rgba(17,24,39,0.3);
  }
  .btn-continue:active{ transform:translateY(0) scale(0.98); }

  .btn-continue.loading{ transform:scale(0.99); }
  .btn-continue:disabled{ cursor:default; }

  .spinner{
    width:15px;
    height:15px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,0.3);
    border-top-color:#FFFFFF;
    animation:spin .7s linear infinite;
    display:none;
  }

  .btn-continue.loading .spinner{ display:inline-block; }
  .btn-continue.loading .btn-label{ opacity:0.9; }

  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- FOOTER ---------- */

  .footer-note{
    text-align:center;
    margin-top:40px;
    font-size:14px;
    color:var(--text-dim);
  }

  .footer-note button,
  .footer-note a{
    background:none;
    border:none;
    color:var(--text-dim);
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    padding:0;
    margin-left:4px;
    text-decoration:none;
    transition:color .25s var(--ease-out), opacity .25s var(--ease-out);
  }
  .footer-note button:hover,
  .footer-note a:hover{ color:var(--accent); }
  .footer-note button:active,
  .footer-note a:active{ color:var(--accent); opacity:0.7; }

  button:focus-visible, input:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }

  @media (max-width:380px){
    .welcome h1{ font-size:32px; }
  }
</style>

          <input type="text" id="username" name="username" placeholder="" autocomplete="username" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>

          <input type="password" id="password" name="password" placeholder="" autocomplete="current-password" required>
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">

          </span>

        <button type="button" class="forgot" id="forgotBtn">Forgot password?</button>
