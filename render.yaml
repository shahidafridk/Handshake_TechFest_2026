services:
  - type: web
    name: handshake-backend
    runtime: node
    plan: starter
    buildCommand: npm install && npm run prisma:generate
    startCommand: npm start
    preDeployCommand: npx prisma migrate deploy
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRY
        value: 12h
      - key: ALLOWED_ORIGINS
        sync: false
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: HANDSHAKE_CODE_LENGTH
        value: "6"
      - key: HANDSHAKE_CODE_EXPIRY_SECONDS
        value: "45"
